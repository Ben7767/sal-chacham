name: עדכון מחירים ופרסום האתר

on:
  schedule:
    - cron: "17 3 * * *"   # every day ~05:17-06:17 Israel time
  workflow_dispatch:       # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנה
        run: pip install -r requirements.txt

      - name: הורדת קבצי מחירים מהרשתות
        run: python scripts/download.py
        continue-on-error: true

      - name: בניית קובץ הנתונים
        run: python scripts/build_data.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
